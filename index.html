<!DOCTYPE html>
<html lang="en">
<head>
  <script src="https://assets.adobedtm.com/83206ba1ed8f/a1f0eb867634/launch-e350af4a2689-development.min.js" async></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TechStore SPA Demo</title>

<style>
body{
    font-family: Arial, sans-serif;
    margin:0;
    padding:0;
}

header{
    background:#222;
    color:#fff;
    padding:15px;
}

nav{
    display:flex;
    gap:15px;
}

nav button{
    padding:10px 20px;
    cursor:pointer;
}

#app{
    padding:40px;
}

.view{
    display:none;
}

.view.active{
    display:block;
}

.card{
    border:1px solid #ddd;
    padding:20px;
    margin-top:20px;
}
</style>
</head>
<body>

<header>
    <h1>TechStore SPA Demo</h1>

    <nav>
        <button onclick="showView('home')">Home</button>
        <button onclick="showView('products')">Products</button>
        <button onclick="showView('cart')">Cart</button>
    </nav>
</header>

<div id="app">

    <!-- Home View -->
    <section id="home" class="view active">
        <h2>Home View</h2>
        <p>Welcome to TechStore.</p>

        <div class="card">
            Home Banner Content
        </div>
    </section>

    <!-- Products View -->
    <section id="products" class="view">
        <h2>Products View</h2>
        <p>Browse our products.</p>

        <div class="card">
            iPhone 16 Pro
        </div>

        <div class="card">
            Samsung S26
        </div>
    </section>

    <!-- Cart View -->
    <section id="cart" class="view">
        <h2>Cart View</h2>
        <p>Your selected products appear here.</p>

        <div class="card">
            Cart is empty
        </div>
    </section>

</div>

<script>

function showView(viewName){

    document.querySelectorAll('.view').forEach(function(view){
        view.classList.remove('active');
    });

    document.getElementById(viewName).classList.add('active');

    console.log('Triggering View:', viewName);

    if(window.adobe &&
       adobe.target &&
       typeof adobe.target.triggerView === 'function'){

        adobe.target.triggerView(viewName);

        console.log('Adobe Target View Fired:', viewName);
    }
}

// Initial View
window.addEventListener('load', function(){

    if(window.adobe &&
       adobe.target &&
       typeof adobe.target.triggerView === 'function'){

        adobe.target.triggerView('home');

        console.log('Adobe Target View Fired: home');
    }
});

</script>

</body>
</html>
