<!DOCTYPE html>
<html lang="en">

<head>

    <!-- Adobe Launch / Data Collection -->
    <script
        src="https://assets.adobedtm.com/83206ba1ed8f/a1f0eb867634/launch-e350af4a2689-development.min.js"
        async>
    </script>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>TechStore SPA Demo</title>


    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        header {
            background: #222;
            color: #fff;
            padding: 15px;
        }

        header h1 {
            margin-top: 0;
        }

        nav {
            display: flex;
            gap: 15px;
        }

        nav button {
            padding: 10px 20px;
            cursor: pointer;
            font-size: 16px;
        }

        #app {
            padding: 40px;
        }

        .view {
            display: none;
        }

        .view.active {
            display: block;
        }

        .card {
            border: 1px solid #ddd;
            padding: 20px;
            margin-top: 20px;
            font-size: 20px;
        }

    </style>

</head>


<body>


<header>

    <h1>TechStore SPA Demo</h1>

    <nav>

        <button onclick="navigateTo('home')">
            Home
        </button>

        <button onclick="navigateTo('products')">
            Products
        </button>

        <button onclick="navigateTo('cart')">
            Cart
        </button>

    </nav>

</header>


<div id="app">


    <!-- ==================================================
         HOME VIEW
         ================================================== -->

    <section
        id="home"
        class="view">

        <h2>Home View</h2>

        <p>
            Welcome to TechStore.
        </p>

        <div class="card">
            Home Banner Content
        </div>

    </section>


    <!-- ==================================================
         PRODUCTS VIEW
         ================================================== -->

    <section
        id="products"
        class="view">

        <h2>Latest Products</h2>

        <p>
            Browse our products.
        </p>

        <div class="card">
            iPhone 16 Pro
        </div>

        <div class="card">
            Samsung S26
        </div>

    </section>


    <!-- ==================================================
         CART VIEW
         ================================================== -->

    <section
        id="cart"
        class="view">

        <h2>Shopping Cart</h2>

        <p>
            Your selected products appear here.
        </p>

        <div class="card">
            Cart is empty
        </div>

    </section>


</div>


<script>


/*
==========================================================
CONFIGURATION
==========================================================
*/

/*
 * GitHub Pages repository base path.
 *
 * Your site:
 *
 * https://8639741727.github.io/techstore-spa-demo/
 */

var BASE_PATH = "/techstore-spa-demo";


/*
==========================================================
ROUTE CONFIGURATION
==========================================================
*/

var routes = {

    home: {

        url: BASE_PATH + "/",

        targetView: "desktop/home"

    },

    products: {

        url: BASE_PATH + "/products",

        targetView: "desktop/products"

    },

    cart: {

        url: BASE_PATH + "/cart",

        targetView: "desktop/cart"

    }

};


/*
==========================================================
ADOBE TARGET READY CHECK
==========================================================
*/

/*
 * Adobe Launch is loaded asynchronously.
 *
 * Therefore, adobe.target may not be available
 * immediately when this JavaScript executes.
 *
 * This function waits until Target is available.
 */

function waitForAdobeTarget(callback) {

    var attempts = 0;

    var maxAttempts = 50;

    var interval = setInterval(function () {

        attempts++;

        if (
            window.adobe &&
            window.adobe.target
        ) {

            clearInterval(interval);

            console.log(
                "Adobe Target is available."
            );

            callback();

            return;

        }


        if (attempts >= maxAttempts) {

            clearInterval(interval);

            console.error(
                "Adobe Target was not available after waiting."
            );

        }

    }, 200);

}


/*
==========================================================
PREFETCH TARGET VIEWS
==========================================================
*/

function prefetchTargetViews() {

    if (
        !window.adobe ||
        !adobe.target ||
        typeof adobe.target.getOffers !== "function"
    ) {

        console.error(
            "Adobe Target getOffers() is not available."
        );

        return;

    }


    console.log(
        "Starting Adobe Target view prefetch..."
    );


    adobe.target.getOffers({

        request: {

            prefetch: {

                views: [

                    {
                        name: "desktop/home"
                    },

                    {
                        name: "desktop/products"
                    },

                    {
                        name: "desktop/cart"
                    }

                ]

            }

        }

    })

    .then(function (response) {

        console.log(
            "======================================"
        );

        console.log(
            "Adobe Target Prefetch Response"
        );

        console.log(
            "======================================"
        );

        console.log(
            response
        );


        if (
            response &&
            response.prefetch &&
            response.prefetch.views
        ) {

            console.log(
                "Prefetched Target Views:"
            );

            console.log(
                response.prefetch.views
            );


            response.prefetch.views.forEach(
                function (view, index) {

                    console.log(
                        "Prefetched View " +
                        index +
                        ":",
                        view.name
                    );

                }
            );

        } else {

            console.warn(
                "No prefetch views found in response."
            );

        }


        /*
         * Once prefetch is complete,
         * display the correct initial view.
         */

        initializeCurrentView();

    })

    .catch(function (error) {

        console.error(
            "Adobe Target Prefetch Error:",
            error
        );


        /*
         * Even if prefetch fails,
         * initialize the SPA.
         */

        initializeCurrentView();

    });

}


/*
==========================================================
GET CURRENT VIEW FROM URL
==========================================================
*/

function getViewFromUrl() {

    var currentPath =
        window.location.pathname;


    console.log(
        "Current browser path:",
        currentPath
    );


    /*
     * Home
     */

    if (
        currentPath === BASE_PATH ||
        currentPath === BASE_PATH + "/"
    ) {

        return "home";

    }


    /*
     * Products
     */

    if (
        currentPath === BASE_PATH + "/products"
    ) {

        return "products";

    }


    /*
     * Cart
     */

    if (
        currentPath === BASE_PATH + "/cart"
    ) {

        return "cart";

    }


    /*
     * Unknown URL
     *
     * Default to Home.
     */

    console.warn(
        "Unknown route. Defaulting to Home."
    );

    return "home";

}


/*
==========================================================
NAVIGATE TO VIEW
==========================================================
*/

function navigateTo(viewName) {

    var route =
        routes[viewName];


    if (!route) {

        console.error(
            "Route not found:",
            viewName
        );

        return;

    }


    console.log(
        "======================================"
    );

    console.log(
        "SPA Navigation"
    );

    console.log(
        "======================================"
    );

    console.log(
        "View:",
        viewName
    );

    console.log(
        "URL:",
        route.url
    );

    console.log(
        "Target View:",
        route.targetView
    );


    /*
     * Update browser URL
     *
     * No page reload.
     */

    history.pushState(

        {
            view: viewName
        },

        "",

        route.url

    );


    /*
     * Display SPA view
     */

    showView(viewName);

}


/*
==========================================================
SHOW VIEW
==========================================================
*/

function showView(viewName) {

    var route =
        routes[viewName];


    if (!route) {

        console.error(
            "Cannot show unknown view:",
            viewName
        );

        return;

    }


    /*
     * Hide all views
     */

    document
        .querySelectorAll(".view")
        .forEach(function (view) {

            view.classList.remove("active");

        });


    /*
     * Show selected view
     */

    var selectedView =
        document.getElementById(viewName);


    if (!selectedView) {

        console.error(
            "DOM element not found:",
            viewName
        );

        return;

    }


    selectedView.classList.add("active");


    console.log(
        "--------------------------------------"
    );

    console.log(
        "Showing SPA View"
    );

    console.log(
        "--------------------------------------"
    );

    console.log(
        "Browser URL:",
        window.location.href
    );

    console.log(
        "SPA View:",
        viewName
    );

    console.log(
        "Adobe Target View:",
        route.targetView
    );


    /*
     * Trigger Adobe Target View
     */

    if (
        window.adobe &&
        window.adobe.target &&
        typeof adobe.target.triggerView === "function"
    ) {

        adobe.target.triggerView(
            route.targetView
        );


        console.log(
            "Adobe Target triggerView() fired:",
            route.targetView
        );

    } else {

        console.warn(
            "Adobe Target triggerView() is not available."
        );

    }

}


/*
==========================================================
INITIALIZE CURRENT VIEW
==========================================================
*/

function initializeCurrentView() {

    var initialView =
        getViewFromUrl();


    console.log(
        "Initial SPA View:",
        initialView
    );


    showView(initialView);

}


/*
==========================================================
BROWSER BACK / FORWARD
==========================================================
*/

window.addEventListener(
    "popstate",
    function () {

        console.log(
            "Browser Back/Forward detected."
        );


        var viewName =
            getViewFromUrl();


        showView(viewName);

    }
);


/*
==========================================================
INITIAL PAGE LOAD
==========================================================
*/

window.addEventListener(
    "load",
    function () {

        console.log(
            "======================================"
        );

        console.log(
            "TechStore SPA loaded."
        );

        console.log(
            "======================================"
        );


        /*
         * Wait for Adobe Target,
         * then prefetch all Target views.
         */

        waitForAdobeTarget(
            function () {

                prefetchTargetViews();

            }
        );

    }
);


</script>


</body>

</html>
