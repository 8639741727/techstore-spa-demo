<!DOCTYPE html>
<html lang="en">

<head>
<!-- Restore deep-link URL (GitHub Pages SPA fix) -->
    <script>
        (function () {
            var redirect = sessionStorage.getItem("spaRedirect");
            if (redirect) {
                sessionStorage.removeItem("spaRedirect");
                history.replaceState(null, "", "/techstore-spa-demo" + redirect);
            }
        })();
    </script>
    <!-- Adobe Launch / Data Collection -->
    <script
        src="https://assets.adobedtm.com/83206ba1ed8f/a1f0eb867634/launch-e350af4a2689-development.min.js"
        async>
    </script>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>TechStore SPA Demo</title>


    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        header {
            background: #222;
            color: #fff;
            padding: 15px;
        }

        header h1 {
            margin-top: 0;
        }

        nav {
            display: flex;
            gap: 15px;
        }

        nav button {
            padding: 10px 20px;
            cursor: pointer;
            font-size: 16px;
        }

        #app {
            padding: 40px;
        }

        .view {
            display: none;
        }

        .view.active {
            display: block;
        }

        .card {
            border: 1px solid #ddd;
            padding: 20px;
            margin-top: 20px;
            font-size: 20px;
        }

    </style>

</head>


<body>


<header>

    <h1>TechStore SPA Demo</h1>

    <nav>

        <button onclick="navigateTo('home')">
            Home
        </button>

        <button onclick="navigateTo('products')">
            Products
        </button>

        <button onclick="navigateTo('cart')">
            Cart
        </button>

    </nav>

</header>


<div id="app">


    <!-- ==================================================
         HOME VIEW
         ================================================== -->

    <section
        id="home"
        class="view">

        <h2>Home View</h2>

        <p>
            Welcome to TechStore.
        </p>

        <div class="card">
            Home Banner Content
        </div>

    </section>


    <!-- ==================================================
         PRODUCTS VIEW
         ================================================== -->

    <section
        id="products"
        class="view">

        <h2>Latest Products</h2>

        <p>
            Browse our products.
        </p>

        <div class="card">
            iPhone 16 Pro
        </div>

        <div class="card">
            Samsung S26
        </div>

    </section>


    <!-- ==================================================
         CART VIEW
         ================================================== -->

    <section
        id="cart"
        class="view">

        <h2>Shopping Cart</h2>

        <p>
            Your selected products appear here.
        </p>

        <div class="card">
            Cart is empty
        </div>

    </section>


</div>


<script>


/*
==========================================================
CONFIGURATION
==========================================================
*/

var BASE_PATH = "/techstore-spa-demo";


/*
==========================================================
ROUTES
==========================================================
*/

var routes = {

    home: {

        url: BASE_PATH + "/",

        targetView: "desktop/home"

    },

    products: {

        url: BASE_PATH + "/products",

        targetView: "desktop/products"

    },

    cart: {

        url: BASE_PATH + "/cart",

        targetView: "desktop/cart"

    }

};


/*
==========================================================
WAIT FOR ADOBE TARGET
==========================================================
*/

function waitForAdobeTarget(callback) {

    var attempts = 0;

    var maxAttempts = 50;

    var interval = setInterval(function () {

        attempts++;

        if (
            window.adobe &&
            window.adobe.target &&
            typeof adobe.target.getOffers === "function"
        ) {

            clearInterval(interval);

            console.log(
                "Adobe Target is available."
            );

            callback();

            return;
        }


        if (attempts >= maxAttempts) {

            clearInterval(interval);

            console.error(
                "Adobe Target was not available."
            );

        }

    }, 200);

}


/*
==========================================================
GET VIEW FROM CURRENT URL
==========================================================
*/

function getViewFromUrl() {

    var path =
        window.location.pathname;


    if (
        path === BASE_PATH ||
        path === BASE_PATH + "/"
    ) {

        return "home";

    }


    if (
        path === BASE_PATH + "/products"
    ) {

        return "products";

    }


    if (
        path === BASE_PATH + "/cart"
    ) {

        return "cart";

    }


    /*
     * Default to Home
     */

    return "home";

}


/*
==========================================================
SHOW DOM VIEW
==========================================================
*/

function displayView(viewName) {

    document
        .querySelectorAll(".view")
        .forEach(function (view) {

            view.classList.remove("active");

        });


    var selectedView =
        document.getElementById(viewName);


    if (selectedView) {

        selectedView.classList.add("active");

    }

}


/*
==========================================================
PREFETCH CURRENT TARGET VIEW
==========================================================
*/

function prefetchAndTriggerView(viewName) {

    var route =
        routes[viewName];


    if (!route) {

        console.error(
            "Route not found:",
            viewName
        );

        return;

    }


    /*
    ------------------------------------------------------
    Show the SPA view immediately
    ------------------------------------------------------
    */

    displayView(viewName);


    console.log(
        "=========================================="
    );

    console.log(
        "Adobe Target SPA Navigation"
    );

    console.log(
        "=========================================="
    );

    console.log(
        "SPA View:",
        viewName
    );

    console.log(
        "Target View:",
        route.targetView
    );

    console.log(
        "Current URL:",
        window.location.href
    );


    /*
    ------------------------------------------------------
    PREFETCH ONLY THE CURRENT VIEW
    ------------------------------------------------------
    */

    adobe.target.getOffers({

        request: {

            prefetch: {

                views: [

                    {
                        name: route.targetView
                    }

                ]

            }

        }

    })

    .then(function (response) {

        console.log(
            "------------------------------------------"
        );

        console.log(
            "Adobe Target Prefetch Response"
        );

        console.log(
            "------------------------------------------"
        );

        console.log(
            response
        );


        /*
        --------------------------------------------------
        Verify prefetched view
        --------------------------------------------------
        */

        if (
            response &&
            response.prefetch &&
            response.prefetch.views
        ) {

            console.log(
                "Prefetched Views:",
                response.prefetch.views
            );


            response.prefetch.views.forEach(
                function (view, index) {

                    console.log(
                        "Prefetched View " +
                        index +
                        ":",
                        view.name
                    );

                }
            );

        }


        /*
        --------------------------------------------------
        Trigger the same view
        --------------------------------------------------
        */

        if (
            window.adobe &&
            adobe.target &&
            typeof adobe.target.triggerView === "function"
        ) {

            adobe.target.triggerView(
                route.targetView
            );


            console.log(
                "Adobe Target triggerView() fired:",
                route.targetView
            );

        } else {

            console.warn(
                "Adobe Target triggerView() is not available."
            );

        }

    })

    .catch(function (error) {

        console.error(
            "Adobe Target Prefetch Error:",
            error
        );

    });

}


/*
==========================================================
NAVIGATE TO VIEW
==========================================================
*/

function navigateTo(viewName) {

    var route =
        routes[viewName];


    if (!route) {

        console.error(
            "Unknown route:",
            viewName
        );

        return;

    }


    /*
     * Update browser URL without reload
     */

    history.pushState(

        {
            view: viewName
        },

        "",

        route.url

    );


    console.log(
        "Navigating to:",
        route.url
    );


    /*
     * Prefetch only this view
     */

    prefetchAndTriggerView(
        viewName
    );

}


/*
==========================================================
BROWSER BACK / FORWARD
==========================================================
*/

window.addEventListener(
    "popstate",
    function () {

        console.log(
            "Browser Back / Forward detected."
        );


        var viewName =
            getViewFromUrl();


        prefetchAndTriggerView(
            viewName
        );

    }
);


/*
==========================================================
INITIAL PAGE LOAD
==========================================================
*/

window.addEventListener(
    "load",
    function () {

        console.log(
            "=========================================="
        );

        console.log(
            "TechStore SPA loaded."
        );

        console.log(
            "=========================================="
        );


        waitForAdobeTarget(
            function () {

                /*
                 * Determine current page
                 */

                var initialView =
                    getViewFromUrl();


                console.log(
                    "Initial SPA View:",
                    initialView
                );


                /*
                 * Prefetch ONLY initial view
                 */

                prefetchAndTriggerView(
                    initialView
                );

            }
        );

    }
);


</script>


</body>

</html>
